<details class="customer-nav" data-customer-nav>
  <summary aria-label="Mở menu tài khoản {{ user.username }}">
    <a class="customer-nav-overview" href="{% url 'profile' %}" aria-label="Hồ sơ tài khoản {{ user.username }}">
    <svg class="customer-nav-avatar" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>
    <span class="customer-nav-name">{{ user.username }}</span>
    </a>
    <svg class="customer-nav-chevron" aria-hidden="true" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m4 6 4 4 4-4"/></svg>
  </summary>
  <nav class="customer-nav-panel" aria-label="Tài khoản khách hàng">
    <div class="customer-nav-heading"><small>Góc riêng của bạn</small><strong>{{ user.username }}</strong></div>
    <a href="{% url 'profile' %}"><span aria-hidden="true">◎</span>Thông tin cá nhân</a>
    <a href="{% url 'orders' %}"><span aria-hidden="true">▤</span>Đơn hàng</a>
    <a href="{% url 'addresses' %}"><span aria-hidden="true">⌖</span>Sổ địa chỉ</a>
    <a href="{% url 'loyalty' %}"><span aria-hidden="true">☆</span>Điểm thành viên</a>
    <a href="{% url 'password_change' %}"><span aria-hidden="true">⚿</span>Đổi mật khẩu</a>
    {% if policy_consent_enabled %}<a href="{% url 'policy_preferences' %}"><span aria-hidden="true">◇</span>Quyền riêng tư</a>{% endif %}
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit"><span aria-hidden="true">↪</span>Đăng xuất</button></form>
  </nav>
</details>
